# ChatFlow Consumer-v3 Default Configuration
# Override via CLI args: java -jar consumer-v3.jar rabbitmq.host=X mysql.host=Y

# RabbitMQ
rabbitmq.host=localhost
rabbitmq.port=5672
rabbitmq.user=admin
rabbitmq.password=admin123
rabbitmq.vhost=/
rabbitmq.prefetch=64
rabbitmq.channel.pool.size=20

# MySQL
mysql.host=localhost
mysql.port=3306
mysql.database=chatflow
mysql.user=chatflow
mysql.password=chatflow123
mysql.pool.size=10

# Batch settings
batch.size=500
batch.flush.interval.ms=500

# Thread pools
consumer.threads=4
writer.threads=4
