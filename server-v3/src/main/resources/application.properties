server.port=8080

# RabbitMQ
rabbitmq.host=localhost
rabbitmq.username=admin
rabbitmq.password=admin123
rabbitmq.channel.pool.size=20

# Consumer
consumer.prefetch=64

# MySQL (read-only for Metrics API)
spring.datasource.url=jdbc:mysql://localhost:3306/chatflow?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=chatflow
spring.datasource.password=chatflow123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP — keep pool small, Metrics API is low-frequency
spring.datasource.hikari.pool-name=ServerMetricsPool
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
